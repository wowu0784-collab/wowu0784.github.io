<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫板块</title>
    <style>        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;            
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 50%, #FF9A9E 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
       
        .header-container {
            width: 100%;
            max-width: 600px;
            padding: 15px 15px 20px 15px;
            display: flex;
            align-items: center;
            background: rgba(255, 230, 240, 0.3);
            backdrop-filter: blur(5px);
        }
       
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1));
        }
      
        .search-bar {
            flex-grow: 1;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            transition: all 0.3s;
        }

        .search-bar:hover {
            background-color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.3);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #d68cb3;
            margin-right: 12px;
        }

        .search-input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: #5d4037;
            width: 100%;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #d68cb3;
            opacity: 0.8;
        }
       
        .filter-section {
            width: 100%;
            max-width: 600px;
            padding: 0 15px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .filter-group:last-child {
            border-bottom: none;
        }

        .filter-label {
            font-weight: bold;
            color: #5d4037;
            margin-right: 15px;
            font-size: 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            height: 30px; 
        }

        .filter-tag {
            background-color: rgba(255, 255, 255, 0.4);
            color: #5d4037;
            padding: 5px 12px;
            border-radius: 15px;
            margin: 5px 8px 5px 0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-tag:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }

        .filter-tag.active {
            background-color: #fff;
            color: #ff1493;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(255, 20, 147, 0.2);
        }
        
        .sort-bar {
            display: flex;
            justify-content: space-around; 
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.3); 
            margin-top: 5px;
        }

        .sort-btn {
            flex: 1; 
            text-align: center;
            background-color: rgba(255, 255, 255, 0.5);
            color: #5d4037;
            padding: 10px 0;
            margin: 0 8px; 
            border-radius: 15px; 
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sort-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .sort-btn.active {
            background-color: #fff;
            color: #ff1493;
            box-shadow: 0 4px 10px rgba(255, 20, 147, 0.3);
            border: 1px solid rgba(255, 20, 147, 0.1);
        }
        
        .content-area {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
  
    <div class="header-container">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>

        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="search-input" placeholder="搜索标题、关键词">
        </div>
    </div>
    
    <div class="filter-section">       
        <div class="filter-group">
            <span class="filter-label">按分类</span>
            <span class="filter-tag active">全部</span>
            <span class="filter-tag">国产动漫</span>
            <span class="filter-tag">日本动漫</span>
            <span class="filter-tag">韩国动漫</span>
            <span class="filter-tag">欧美动漫</span>          
        </div>
       
        <div class="filter-group">
            <span class="filter-label">按地区</span>
            <span class="filter-tag active">全部</span>
            <span class="filter-tag">大陆</span>          
            <span class="filter-tag">日本</span>
            <span class="filter-tag">韩国</span>
            <span class="filter-tag">欧美</span>   
            <span class="filter-tag">其他</span>
        </div>
    
        <div class="filter-group">
            <span class="filter-label">按年份</span>
            <span class="filter-tag active">全部</span>
            <span class="filter-tag">2026</span>
            <span class="filter-tag">2025</span>
            <span class="filter-tag">2024</span>
            <span class="filter-tag">2023</span>
            <span class="filter-tag">2022</span>
            <span class="filter-tag">2021</span>
            <span class="filter-tag">2020</span>
            <span class="filter-tag">2019</span>
            <span class="filter-tag">2018</span>
            <span class="filter-tag">2017</span>
            <span class="filter-tag">2016</span>
            <span class="filter-tag">2015</span>
            <span class="filter-tag">2014</span>
            <span class="filter-tag">2013</span>
            <span class="filter-tag">2012</span>
            <span class="filter-tag">2011</span>
            <span class="filter-tag">2010</span>
            <span class="filter-tag">2009</span>
            <span class="filter-tag">2008</span>
            <span class="filter-tag">2007</span>
            <span class="filter-tag">其他</span>
        </div>
      
        <div class="filter-group">
            <span class="filter-label">按语言</span>
            <span class="filter-tag active">全部</span>
            <span class="filter-tag">国语</span>   
            <span class="filter-tag">英语</span>
            <span class="filter-tag">韩语</span>
            <span class="filter-tag">日语</span>          
            <span class="filter-tag">其它</span>
        </div>
        
        <div class="sort-bar">
            <div class="sort-btn active" onclick="selectSort(this)">最新</div>
            <div class="sort-btn" onclick="selectSort(this)">热度</div>
            <div class="sort-btn" onclick="selectSort(this)">推荐</div>
        </div>
    </div>
   
    <div class="content-area">
        <p>页面内容区域...</p>
    </div>

    <script>        
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', function() {          
                const group = this.parentElement;             
                group.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));             
                this.classList.add('active');
            });
        });

        
        function selectSort(element) {            
            const buttons = document.querySelectorAll('.sort-btn');          
            buttons.forEach(btn => btn.classList.remove('active'));        
            element.classList.add('active');
        }
    </script>

</body>
</html>
