<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #fffafc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #ff4d8d;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #ff4d8d;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 16px;
    color: #333;
    background: rgba(255,255,255,0.8);
    padding: 6px 12px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    cursor: pointer;
}

.back-btn:active {
    opacity: 0.7;
}
</style>
</head>

<body>
<div class="back-btn" onclick="history.back()">← 返回</div>

<div class="box">
    <h2>用户登录</h2>

    <input type="text" placeholder="账号">
    <input type="password" placeholder="密码">

    <button onclick="login()">登录</button>

<div style="text-align: right; margin-top: 10px;">
    <a href="forgot.html " style="
        font-size: 13px;
        color: #999;
        text-decoration: none;
    ">
        忘记密码？
    </a >
</div>

<div style="text-align:center; margin-top:15px;">
    <a href="register.html " style="color:#ff4d8d; text-decoration:none; font-size:14px;">
        没有账号？去注册
    </a >
</div>

</div>

<script>
function login(){
    alert("登录成功（演示用）");
    window.location.href = "index.html";
}
</script>

</body>
</html>
