<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">   
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J社ACG - 社区首页</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    background-color: #fff0f5;
    background-image: radial-gradient(#ffb7c5 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px 0;
}

/* 容器 */
.container {
    width: 92%;
    max-width: 500px;
    background: rgba(255,255,255,0.6);
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(255,105,180,0.15);
}

/* 标题 */
.header h1 {
    text-align: center;
    color: #d63384;
    font-size: 24px;
    margin-bottom: 15px;
}

/* banner（修复：去掉嵌套） */
.banner {
    width: 100%;
    height: 140px;
    border-radius: 20px;
    overflow: hidden;
    background: url("images/12.jpg") center/cover no-repeat;
}

/* 公告 */
.notice {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #888;
    margin: 15px 5px;
}

/* 网格 */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 130px 90px;
    gap: 15px;
}

/* 卡片基础 */
.card {
    border-radius: 22px;
    padding: 18px;
    color: white;
    position: relative;
    overflow: hidden;
}

/* A */
.a {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
    background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
                url("images/11.jpg") center/cover no-repeat;
}

/* B */
.b {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
    background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
                url("images/15.jpg") center/cover no-repeat;
}

/* C */
.c {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
                url("images/13.jpg") center/cover no-repeat;
}

/* D */
.d {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
    background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
                url("images/14.jpg") center/cover no-repeat;
}

/* 文本层级 */
.card h3,
.card p {
    position: relative;
    z-index: 2;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌸 J社ACG社区</h1>
    </div>

    <div class="banner"></div>

    <div class="notice">
        <span>社区板块</span>
        <span>📢 最新域名: J-ACG.COM</span>
    </div>

    <div class="grid">

        <div class="card a">
            <h3>黄油世界</h3>
            <p>汉化游戏</p >
        </div>

        <div class="card b">
            <h3>动漫里番</h3>
            <p>高清内容</p >
        </div>

        <div class="card c">
            <h3>漫画天地</h3>
            <p>全彩漫画</p >
        </div>

        <div class="card d">
            <h3>在线小说</h3>
            <p>轻小说</p >
        </div>

    </div>

</div>

</body>
</html>
