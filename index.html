<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">   
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J社ACG - 社区首页</title>

<style>

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    
    background-color: #fffafc;   
    background-image: radial-gradient(rgba(255, 182, 193, 0.12) 1px, transparent 1px);
    background-size: 24px 24px;

    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px 0;
}


.container {
    width: 92%;
    max-width: 500px; 
    background: rgba(255, 255, 255, 0.6); 
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(255, 105, 180, 0.15);
    backdrop-filter: blur(5px);
}


.header h1 {
    text-align: center;
    color: #d63384;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 15px;
    text-shadow: 2px 2px 0px #fff;
}


.banner {
    width: 100%;
    height: 140px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);

    background: url('https://cdn.phototourl.com/free/2026-04-26-9c365ed9-12d3-422a-a9be-1074287e1b67.jpg') center/cover no-repeat;
}


.notice {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #888;
    margin: 15px 5px;
    font-weight: 600;
}


.notice span:first-child {
    font-weight: 900;
    color: #000;
}

.notice span:last-child {
    color: #d63384;
    background: #ffe0e9;
    padding: 2px 8px;
    border-radius: 10px;
}


.grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr; 
    grid-template-rows: 130px 90px;
    gap: 15px;
}


.card {
    border-radius: 22px;
    padding: 18px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s ease;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    backdrop-filter: blur(2px); 
}

.card:active { transform: scale(0.94); }

.card h3 {
    font-size: 20px;
    margin-bottom: 5px;
    z-index: 2;
    font-weight: 800;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
}

.card p {
    font-size: 12px;
    opacity: 0.9;
    z-index: 2;
    font-weight: 500;
    text-shadow: 1px 1px 1px rgba(255,255,255,0.3);
}


.a {
   grid-column: 1 / 3;
   grid-row: 1 / 2;
   color: #fff;
   background-image:
        linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
        url('https://cdn.phototourl.com/free/2026-04-26-c36533b4-0db9-445b-a910-11aabe1e59a1.jpg');
   background-position: center;
   background-size: cover;
   background-repeat: no-repeat;
}


.b {
    grid-column: 3 / 4;
    grid-row: 1 / 3; 
    color: #fff;
    background-image:
        linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
        url('https://cdn.phototourl.com/free/2026-04-26-eae8bd6b-6c39-4b47-af8e-8cc69fef0b90.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}


.c {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    color: #fff;
    background-image:
        linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
        url('https://cdn.phototourl.com/free/2026-04-26-8aecd720-1bee-4494-b509-34f123ccafb0.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}


.d {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
    color: #fff;
    background-image:
        linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.1)),
        url('https://cdn.phototourl.com/free/2026-04-26-6586c47d-a972-40db-a695-055df2730f10.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}


@media (max-width: 380px) {
    .grid { grid-template-rows: 110px 80px; gap: 12px; }
    .card { padding: 15px; border-radius: 18px; }
    .card h3 { font-size: 18px; }
    .card p { font-size: 11px; }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌸 J社ACG社区</h1>
    </div>

    <div class="banner"></div>

    <div class="notice">
        <span>社区板块:</span>
        <span>📢 最新域名: J-ACG.COM</span>
    </div>

    <div class="grid">

        <div class="card a">
            <h3>「黄油世界」</h3>
            <p>海量汉化游戏等你来玩</p >
        </div>

        <div class="card b">
            <h3>「动漫里番」</h3>
            <p>高清无修福利姬</p >
        </div>

        <div class="card c">
            <h3>「漫画天地」</h3>
            <p>高清全彩漫画</p >
        </div>

        <div class="card d">
            <h3>「在线小说」</h3>
            <p>轻小说/同人本</p >
        </div>

    </div>

</div>

</body>
</html>
