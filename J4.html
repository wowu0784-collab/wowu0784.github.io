
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板块界面</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            
            
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 50%, #FF9A9E 100%);
            
            /* background: linear-gradient(to bottom, #ffdde1, #ee9ca7); */
            
            min-height: 100vh;
            
            
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
        }

        
        .header-container {
            width: 100%;
            max-width: 600px;
            
            
            padding: 15px 15px 20px 15px;
            
            display: flex;
            align-items: center;
            
            
            background: rgba(255, 230, 240, 0.3); 
            backdrop-filter: blur(5px);
        }

        
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: white; 
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1)); 
        }

        
        .search-bar {
            flex-grow: 1;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.9);
            
            
            border-radius: 25px; 
            
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2); 
            transition: all 0.3s;
        }

        .search-bar:hover {
            background-color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.3);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #d68cb3; 
            margin-right: 12px;
        }

        .search-input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: #5d4037; 
            width: 100%;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #d68cb3; 
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header-container">
        
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>

        
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="search-input" placeholder="搜索标题、关键词">
        </div>
    </div>

   
    <div style="width:100%; max-width:600px; padding: 20px; color: white; text-align: center;">
        <p>页面内容区域...</p>
    </div>

</body>
</html>
