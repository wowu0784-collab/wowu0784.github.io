<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄油板块</title>
    <style>        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                       
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 50%, #FF9A9E 100%);
            
            min-height: 100vh;
            
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
        }
       
        .header-container {
            width: 100%;
            max-width: 600px;
            padding: 15px 15px 10px 15px; 
            display: flex;
            align-items: center;
            background: rgba(255, 230, 240, 0.3); 
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: white; 
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1)); 
        }
        
        .search-bar {
            flex-grow: 1;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px; 
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2); 
            transition: all 0.3s;
        }

        .search-bar:hover {
            background-color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.3);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #d68cb3; 
            margin-right: 12px;
        }

        .search-input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: #5d4037; 
            width: 100%;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #d68cb3; 
            opacity: 0.8;
        }
        
        .filter-bar {
            width: 100%;
            max-width: 600px;
            padding: 15px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent; 
        }

        .filter-item {
            flex: 1; 
            text-align: center;
            padding: 10px 0; 
            margin: 0 6px;
            font-size: 15px;
            color: #c2185b;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none; 
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.15);
            transition: all 0.2s ease;
        }

        .filter-item:first-child { margin-left: 0; }
        .filter-item:last-child { margin-right: 0; }

        .filter-item:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.25);
        }

        .filter-item.active {
            background: #fff;
            color: #ff1493;
            box-shadow: 0 2px 4px rgba(255, 20, 147, 0.3);
            border: 1px solid rgba(255, 20, 147, 0.2);
        }
        
        .expand-section {
            width: 100%;
            max-width: 600px;
            padding: 0 15px 15px 15px;
        }

        details.expand-details {
            width: 100%;
        }

        summary.expand-summary {
            list-style: none; 
            text-align: center;
            padding: 10px 0;
            font-size: 15px;
            color: #c2185b;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.15);
            transition: all 0.2s ease;
            user-select: none;
            outline: none; 
        }

        summary.expand-summary:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
       
        summary.expand-summary::-webkit-details-marker {
            display: none;
        }
       
        .dropdown-panel {
            margin-top: 10px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.15);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tag-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3列 */
            gap: 12px;
            margin-bottom: 20px;
        }

        .tag-item {
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            color: #880e4f;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-item:hover, .tag-item.selected {
            background: #fff;
            border-color: #ff1493;
            color: #ff1493;
            font-weight: bold;
        }
       
        .confirm-btn {
            width: 100%;
            height: 40px; 
            background: linear-gradient(to right, #ff6a88, #ff99ac);
            color: white;
            border: none;            
            border-radius: 25px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 105, 136, 0.4);
            transition: transform 0.1s;
        }

        .confirm-btn:active {
            transform: scale(0.98);
        }
        
        .content-area {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <div class="header-container">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="search-input" placeholder="搜索标题、关键词、游戏类型">
        </div>
    </div>
    
    <div class="filter-bar">
        <div class="filter-item active" onclick="selectFilter(this)">更新时间</div>
        <div class="filter-item" onclick="selectFilter(this)">热门浏览</div>
        <div class="filter-item" onclick="selectFilter(this)">评论最多</div>
    </div>
    
    <div class="expand-section">
        <details class="expand-details">
            <summary class="expand-summary">展开更多 ▼</summary>
            <div class="dropdown-panel">               
                <div class="tag-grid">
                    <div class="tag-item" onclick="toggleTag(this)">SLG</div>
                    <div class="tag-item" onclick="toggleTag(this)">RPG</div>
                    <div class="tag-item" onclick="toggleTag(this)">ADV</div>
                    <div class="tag-item" onclick="toggleTag(this)">3D</div>
                    <div class="tag-item" onclick="toggleTag(this)">安卓</div>
                    <div class="tag-item" onclick="toggleTag(this)">电脑</div>
                </div>          
                <button class="confirm-btn" onclick="applyFilter()">筛选确认</button>
            </div>
        </details>
    </div>
   
    <div class="content-area">
        <p>点击“展开更多”查看筛选标签。</p>
    </div>
   
    <script>
        // 普通排序按钮切换
        function selectFilter(element) {
            const items = document.querySelectorAll('.filter-item');
            items.forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
        }

        // 标签选中效果
        function toggleTag(element) {
            element.classList.toggle('selected');
        }

        // 筛选确认
        function applyFilter() {
            alert("正在应用筛选条件...");
        }
    </script>

</body>
</html>
